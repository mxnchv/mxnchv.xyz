# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."

# Everyone: allow the camera only for this site (Lab hand synth), sane defaults.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Videos, sounds and images rarely change: let browsers keep them for a week.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Hand-tracking engine (MediaPipe) is versioned and big: cache it for a month.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
